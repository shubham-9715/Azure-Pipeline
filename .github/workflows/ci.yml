name: C++ + PyTest + Debian Package CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # ======================================================
  # 1️⃣ BUILD + TEST + PACKAGE (LINUX)
  # ======================================================
  build-test-package:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # -------------------------------
    # Install Dependencies
    # -------------------------------
    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          libgtest-dev \
          python3 \
          python3-pip

    # -------------------------------
    # Configure & Build
    # -------------------------------
    - name: Configure CMake
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cmake --build build --parallel

    # -------------------------------
    # Run C++ Tests
    # -------------------------------
    - name: Run CTest
      run: |
        cd build
        ctest --output-on-failure

    # -------------------------------
    # Run PyTests
    # -------------------------------
    - name: Install PyTest
      run: |
        pip3 install pytest

    - name: Run PyTests
      run: |
        pytest pytests -v

    # -------------------------------
    # Build Debian Package
    # -------------------------------
    - name: Build Debian Package (.deb)
      run: |
        cd build
        cpack -G DEB

    # -------------------------------
    # Upload .deb as artifact
    # -------------------------------
    - name: Upload Debian Package
      uses: actions/upload-artifact@v4
      with:
        name: debian-package
        path: build/*.deb

  # ======================================================
  # 2️⃣ DEPLOY TO JFROG ARTIFACTORY (APT)
  # ======================================================
  deploy:
    runs-on: ubuntu-latest
    needs: build-test-package

    steps:
    - name: Download Debian Package
      uses: actions/download-artifact@v4
      with:
        name: debian-package
        path: deb

    - name: Upload to JFrog Artifactory (APT Repo)
      run: |
        for pkg in deb/*.deb; do
          echo "Uploading $pkg"
          curl -H "Authorization: Bearer ${{ secrets.JFROG_TOKEN }}" \
               -T "$pkg" \
               "${{ secrets.JFROG_URL }}/deb-local/$(basename $pkg)"
        done
