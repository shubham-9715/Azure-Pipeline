# azure-pipelines.yml
trigger:
  branches:
    include:
      - main
      - feature/*

variables:
  BUILD_DIR: 'build'

stages:
  # ===============================
  # Stage 1: Build
  # ===============================
  - stage: Build
    displayName: "Build Stage"
    jobs:
      - job: BuildJob
        displayName: "Build Project"
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              echo "Creating build directory"
              mkdir -p $(BUILD_DIR)
              cd $(BUILD_DIR)
              cmake ..
              cmake --build . -- -j$(nproc)
            displayName: "Build Project"

          # Publish the entire build folder as an artifact
          - publish: $(BUILD_DIR)
            artifact: build
            displayName: "Publish Build Artifacts"

  # ===============================
  # Stage 2: Unit Test
  # ===============================
  - stage: UnitTest
    displayName: "Unit Test Stage"
    dependsOn: Build
    jobs:
      - job: TestJob
        displayName: "Run Unit Tests"
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          # Download build artifacts from Build stage
          - download: current
            artifact: build

          - script: |
              cd $(Pipeline.Workspace)/build/tests
              chmod +x ./calc_unittests
              ./calc_unittests
            displayName: "Run Unit Tests"
